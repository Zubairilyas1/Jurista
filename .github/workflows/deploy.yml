name: CD Pipeline

on:
  push:
    branches: [ "main" ]
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch: 

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Backend Stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Port is 22 by default, update if your VPS uses a custom SSH port
          script: |
            # 1. Navigate to the project directory on your VPS
            cd /opt/jurista  # REPLACE this with your actual server path
            
            # 2. Pull the latest code from the main branch
            git pull origin main
            
            # 3. Rebuild and restart the Docker stack (Postgres, Redis, Qdrant, API)
            docker-compose build api
            docker-compose up -d
            
            # 4. Frontend Deployment Note:
            # If deploying Next.js on this same server, you would run:
            # cd frontend && npm install && npm run build && pm2 restart jurista-frontend
            # (Alternatively, if using Vercel, Next.js will deploy automatically via Vercel's GitHub integration)
